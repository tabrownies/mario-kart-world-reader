name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install grpcio grpcio-tools protobuf
          
      - name: Run Python tests
        run: |
          cd packages/types/python
          python -m unittest test_translator.py

  test-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install TypeScript dependencies
        run: |
          cd packages/types/typescript
          npm install
          
      - name: Run TypeScript tests
        run: |
          cd packages/types/typescript
          npm run test

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js for Prettier
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Node dependencies
        run: npm install
        
      - name: Check Prettier formatting
        run: npx prettier --check "**/*.{ts,js,json,md}" --config packages/formatters/.prettierrc
        
      - name: Run ESLint
        run: npm run lint:ts
        
      - name: Set up Python for Ruff
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Ruff
        run: pip install ruff
        
      - name: Check Ruff formatting
        run: |
          ruff format --check --config packages/formatters/pyproject.toml .
          ruff check --config packages/formatters/pyproject.toml .
          
      - name: Check Protobuf formatting
        run: |
          sudo apt-get install -y clang-format
          clang-format --style=file:packages/formatters/.clang-format --Werror -n packages/types/data.proto
