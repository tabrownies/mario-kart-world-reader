enum RaceCourse {
  // Enums must have unique names within the package
  TRACK_UNKNOWN = 0;
  RAINBOW_ROAD = 1;
  // we will fill these out as we go
  // Convention: intermission tracks named as <course_name_one>_to_<course_name_two>
}

enum RacePhase {
  PHASE_UNKNOWN = 0;
  PRE_COUNTDOWN = 1;
  COUNTDOWN = 2;
  RACING = 3;
  FINISHED = 4;
}

