// END OF CLASSIFIED ENUMS

message FrameData {
  LapNumber lap_number = 1;
  RacePhase race_phase = 2;
  NumCoins num_coins = 3;
  Item primary_item = 4;
  Item secondary_item = 5;
  Placement placement = 6;
  RaceCourse race_course = 7;
}

message RaceCourseInfo {
  string name = 1;
  RaceCourse shortened_name = 2;
  RaceCourseType type = 3;
  LapNumber number_of_laps = 4;

  enum RaceCourseType {
    COURSE_TYPE_UNKNOWN = 0;
    STANDARD_LOOP = 1;
    STANDARD_POINT_TO_POINT = 2;
    INTERMISSION = 3;
    KNOCKOUT_SECTION = 4;
    LONG_LOOP = 5; // this is like rainbow road
  }
}

message RaceCourseInfoList {
  repeated RaceCourseInfo courses = 1;
}
